# Vérifications automatiques à chaque push et pull request : les tests Python et la compilation des 2 applications.
name: Vérifications
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pillow imagehash requests python-dotenv
      - name: Tests du Recorder
        run: cd alejandro-cto/recorder && python -m pytest -q tests
      - name: Tests du floutage et de la détection
        run: PYTHONPATH=omar-caio python -m pytest -q omar-caio/tests

  nextjs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [vladimir-cao/portails, binta-cpo/app/ghost-ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.app }}
      - run: npx next build
        working-directory: ${{ matrix.app }}
